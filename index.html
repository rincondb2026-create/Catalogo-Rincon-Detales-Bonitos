            --rosa-pastel: #ffe3ec;
            --texto-oscuro: #2b2b2b;
            --blanco-puro: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--blanco-roto); color: var(--texto-oscuro); padding-bottom: 120px; }
        header { background-color: var(--blanco-puro); text-align: center; padding: 30px 20px; border-bottom: 3px solid var(--rosa-pastel); }
        .logo-container { margin-bottom: 15px; display: flex; justify-content: center; }
        .logo-placeholder { border: 3px dashed var(--rosa-chicle); padding: 10px 25px; border-radius: 50px; color: var(--rosa-chicle); font-size: 1.8rem; font-weight: bold; background-color: var(--blanco-roto); }
        header h1 { color: var(--rosa-chicle); font-size: 2.2rem; margin-bottom: 8px; }
        header p { color: #666; font-size: 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .category-title { color: var(--rosa-chicle); border-left: 5px solid var(--rosa-chicle); padding-left: 12px; margin: 40px 0 20px 0; font-size: 1.6rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .product-card { background-color: var(--blanco-puro); border: 1px solid var(--rosa-pastel); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .product-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; min-height: 44px; display: flex; align-items: center; }
        .product-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .product-price { font-size: 1.3rem; font-weight: bold; color: var(--rosa-chicle); }
        .btn-add { background-color: var(--rosa-chicle); color: var(--blanco-puro); border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .btn-add:hover { background-color: var(--rosa-oscuro); }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--blanco-puro); box-shadow: 0 -5px 25px rgba(0,0,0,0.1); padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-top: 2px solid var(--rosa-pastel); }
        .cart-info { font-size: 1.1rem; }
        .cart-info span { font-weight: bold; color: var(--rosa-chicle); }
        .btn-order { background-color: #25D366; color: white; border: none; padding: 14px 28px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .btn-order:disabled { background-color: #cccccc; cursor: not-allowed; }
        @media (max-width: 600px) { .cart-bar { flex-direction: column; gap: 15px; } .btn-order { width: 100%; justify-content: center; } }
    </style>

        const cart = {};

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            const categorias = [...new Set(productos.map(p => p.cat))];
            
            categorias.forEach(cat => {
                const title = document.createElement('h2');
                title.className = 'category-title';
                title.innerText = cat;
                container.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'products-grid';

                const filtered = productos.filter(p => p.cat === cat);
                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-name">${p.name}</div>
                        <div class="product-actions">
                            <div class="product-price">${p.price.toFixed(2)}€</div>
                            <button class="btn-add" onclick="addToCart(${p.id})">Añadir</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            });
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCartBar();
        }

        function updateCartBar() {
            let totalItems = 0;
            let totalPrice = 0;

            for (const id in cart) {
                const prod = productos.find(p => p.id == id);
                totalItems += cart[id];
                totalPrice += prod.price * cart[id];
            }

            document.getElementById('cart-count').innerText = totalItems;
            document.getElementById('cart-total').innerText = totalPrice.toFixed(2) + '€';
            document.getElementById('btn-whatsapp').disabled = totalItems === 0;
        }

        function sendOrder() {
            let textoMensaje = "🌸 ¡Hola! Me gustaría realizar el siguiente pedido:\n\n";
            let totalPrice = 0;

            for (const id in cart) {
                const prod = productos.find(p => p.id == id);
                const subtotal = prod.price * cart[id];
                totalPrice += subtotal;
                textoMensaje += `▪️ *${cart[id]}x* ${prod.name} (${prod.price.toFixed(2)}€ c/u) → *${subtotal.toFixed(2)}€*\n`;
            }

            textoMensaje += `\n💰 *Total del pedido: ${totalPrice.toFixed(2)}€*`;
            
            const urlText = encodeURIComponent(textoMensaje);
            const whatsappUrl = `https://wa.me{TELEFONO_WHATSAPP}?text=${urlText}`;
            window.open(whatsappUrl, '_blank');
        }

        window.onload = renderCatalog;
